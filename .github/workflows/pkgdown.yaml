# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Triggers on einar_dev/integration specifically, not the default branch --
# this fork's work-in-progress lives there, master is left untouched.
on:
  push:
    branches: [einar_dev/integration]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Don't run if this workflow file gets forked elsewhere
    if: github.repository == 'einarhjorleifsson/icesDatras'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
